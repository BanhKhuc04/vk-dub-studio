[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vk-dub-studio"
version = "2.1.14"
description = "Auto-dubbing pipeline for short drama & Douyin clips"
requires-python = ">=3.12,<3.14"
dependencies = ["PySide6>=6.8,<6.11", "faster-whisper>=1.2,<2", "httpx>=0.28,<1", "keyring>=25,<26", "numpy>=2,<3", "playwright>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.gui-scripts]
vk-dub-studio = "vkdub.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/vk-dub-studio" = [
    "resources/capcut_v360000_template.json",
    "resources/icon.ico",
    "resources/icon.png",
    "resources/provider_pricing.json",
    "resources/subtitle_presets.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["CODEX_MASTER_PROMPT_VK_DUB_STUDIO.md", ".runtime", "docs/evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "vieneu.*", "capcut_tts_api.*", "playwright.*"]
ignore_missing_imports = true
