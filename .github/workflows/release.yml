name: Build & Release VK Dub Studio

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev] pyinstaller

      - name: Build Standalone Application
        run: |
          python packaging/build_exe.py

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/VK-Dub-Studio.iss

      - name: Calculate SHA-256 Checksum
        id: checksum
        shell: pwsh
        run: |
          $installerPath = "dist/VK-Dub-Studio-Setup-x64.exe"
          $hash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLower()
          Write-Output "Installer SHA256: $hash"
          echo "INSTALLER_SHA256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VK-Dub-Studio-Setup-x64.exe
            packaging/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n