<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAPPAK — Nền Tảng Video Tools Cho Nhà Sáng Tạo (Neo Brutalism Edition)</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              yellow: '#fde047',
              yellowDark: '#eab308',
              blue: '#2563eb',
              blueDark: '#1d4ed8',
              blueLight: '#dbeafe',
              pink: '#f472b6',
              pinkLight: '#fce7f3',
              purple: '#a855f7',
              green: '#22c55e',
              greenLight: '#dcfce7',
              dark: '#0f172a',
              card: '#ffffff',
              surface: '#f8fafc',
            }
          },
          boxShadow: {
            'neo-sm': '2px 2px 0px #0f172a',
            'neo': '3.5px 3.5px 0px #0f172a',
            'neo-lg': '6px 6px 0px #0f172a',
            'neo-xl': '8px 8px 0px #0f172a',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .neo-border { border: 2px solid #0f172a; }
    .neo-border-thick { border: 2.5px solid #0f172a; }
    .neo-card {
      background-color: #ffffff;
      border: 2.5px solid #0f172a;
      border-radius: 14px;
      box-shadow: 4px 4px 0px #0f172a;
      transition: all 0.15s ease;
    }
    .neo-card:hover {
      transform: translateY(-2px);
      box-shadow: 6px 6px 0px #0f172a;
    }
    .neo-card-static {
      background-color: #ffffff;
      border: 2.5px solid #0f172a;
      border-radius: 14px;
      box-shadow: 4px 4px 0px #0f172a;
    }
    .neo-btn {
      border: 2.5px solid #0f172a;
      border-radius: 10px;
      font-weight: 700;
      box-shadow: 3px 3px 0px #0f172a;
      transition: all 0.12s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .neo-btn:hover {
      transform: translate(-1.5px, -1.5px);
      box-shadow: 4.5px 4.5px 0px #0f172a;
    }
    .neo-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #0f172a;
    }
    .neo-sticker {
      display: inline-block;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border: 2px solid #0f172a;
      border-radius: 8px;
      box-shadow: 2.5px 2.5px 0px #0f172a;
      padding: 3px 10px;
      user-select: none;
    }
    .stepper-active {
      background-color: #dbeafe !important;
      border-color: #2563eb !important;
      box-shadow: 3px 3px 0px #1d4ed8 !important;
    }
  </style>
</head>
<body class="text-slate-900 antialiased selection:bg-brand-yellow selection:text-slate-900">
